name: Lab V5.6 isolated regression
on:
  pull_request:
    branches: [lerika-cabinet-v1]
    paths: ['index.html', 'cabinet/**', 'tests/**', '.github/workflows/lab-v56.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cabinet/requirements.txt
      - run: python -m unittest -v test_design_studio
        working-directory: cabinet
      - name: Validate scripts and preserve the furniture engine
        run: |
          python - <<'PY'
          import re, subprocess, pathlib, tempfile
          new=pathlib.Path('index.html').read_text()
          old=subprocess.check_output(['git','show','origin/lerika-cabinet-v1:index.html'],text=True)
          def scripts(s):return re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I)
          a,b=scripts(old),scripts(new)
          assert len(b) in (len(a),len(a)+2,len(a)+3)
          if len(b)==len(a)+3:
              assert [i for i,(x,y) in enumerate(zip(a,b)) if x!=y]==[1,6,7,11], 'Unexpected original script change'
              assert b[1].replace('3d|ai|config|plan|engineering|order','3d|ai|config|plan')==a[1]
              old_studio=b[6].replace('3d|ai|config|plan|engineering|order','3d|ai|config|plan').replace(',"engineering":"05 / Инженерная лаборатория","order":"Отправить заказ"','').replace(';document.getElementById("le-panel").hidden=key!=="engineering";document.getElementById("lo-panel").hidden=key!=="order"','')
              assert old_studio==a[6]
              assert re.sub(r'document\.getElementById\("le-from-3d"\)\.onclick=.*?;\n','',b[7])==a[7]
              assert re.sub(r'document\.getElementById\("le-from-plan"\)\.onclick=.*?;\n','',b[11])==a[11]
          elif len(b)==len(a)+2:
              assert [i for i,(x,y) in enumerate(zip(a,b)) if x!=y]==[1,6]
          else:
              assert all(a[i]==b[i] for i in [2,3,4,5,8,9,10] if i<len(a)), 'Shared engine changed'
          assert 'id="lab-ai-generate"' not in new
          with tempfile.TemporaryDirectory() as td:
              for i,js in enumerate(b):
                  if not js.strip():continue
                  p=pathlib.Path(td)/f'{i}.js';p.write_text(js)
                  subprocess.run(['node','--check',str(p)],check=True)
          print('Furniture engine and other non-studio scripts unchanged; JS syntax OK')
          PY
      - name: Room planner core tests
        if: ${{ hashFiles('tests/room-planner.cjs') != '' }}
        run: node tests/room-planner.cjs
      - name: Room planner mobile browser tests
        if: ${{ hashFiles('tests/room-planner-browser.cjs') != '' }}
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node tests/room-planner-browser.cjs
      - name: Engineering geometry tests
        if: ${{ hashFiles('tests/engineering.cjs') != '' }}
        run: node tests/engineering.cjs
      - name: Engineering mobile browser tests
        if: ${{ hashFiles('tests/engineering-browser.cjs') != '' }}
        run: node tests/engineering-browser.cjs

      - name: Responsive layout regression
        if: ${{ hashFiles('tests/mobile-layout.cjs') != '' }}
        run: node tests/mobile-layout.cjs
