name: Lab V5.6 isolated regression
on:
  pull_request:
    branches: [lerika-cabinet-v1, lerika-v521-calculations]
    paths: ['index.html', 'portfolio-api.js', 'scene-*.webp', 'cabinet/**', 'tests/**', '.github/workflows/lab-v56.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cabinet/requirements.txt
      - run: python -m unittest -v test_design_studio
        working-directory: cabinet
      - name: Validate scripts and preserve the furniture engine
        run: |
          python - <<'PY'
          import re, subprocess, pathlib, tempfile, os
          new=pathlib.Path('index.html').read_text()
          base='b867014724a6b0e4aa2a08e60877861564eca517' if os.environ.get('GITHUB_HEAD_REF')=='lerika-v522-geometry' else 'origin/lerika-cabinet-v1'
          old=subprocess.check_output(['git','show',base+':index.html'],text=True)
          def scripts(s):return re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I)
          a,b=scripts(old),scripts(new)
          assert len(b) in (len(a),len(a)+1,len(a)+2,len(a)+3)
          if len(b)==len(a)+1:
              assert [i for i,(x,y) in enumerate(zip(a,b)) if x!=y]==[14], 'Unexpected original script change'
          elif len(b)==len(a)+3:
              assert [i for i,(x,y) in enumerate(zip(a,b)) if x!=y]==[1,6,7,11], 'Unexpected original script change'
              assert b[1].replace('3d|ai|config|plan|engineering|order','3d|ai|config|plan')==a[1]
              old_studio=b[6].replace('3d|ai|config|plan|engineering|order','3d|ai|config|plan').replace(',"engineering":"05 / Инженерная лаборатория","order":"Отправить заказ"','').replace(';document.getElementById("le-panel").hidden=key!=="engineering";document.getElementById("lo-panel").hidden=key!=="order"','')
              assert old_studio==a[6]
              assert re.sub(r'document\.getElementById\("le-from-3d"\)\.onclick=.*?;\n','',b[7])==a[7]
              assert re.sub(r'document\.getElementById\("le-from-plan"\)\.onclick=.*?;\n','',b[11])==a[11]
          elif len(b)==len(a)+2:
              assert [i for i,(x,y) in enumerate(zip(a,b)) if x!=y]==[1,6]
          else:
              if os.environ.get('GITHUB_HEAD_REF')=='lerika-v522-geometry':
                  baseline=scripts(subprocess.check_output(['git','show','b867014724a6b0e4aa2a08e60877861564eca517:index.html'],text=True))
                  assert len(b)==len(baseline) and [i for i,(x,y) in enumerate(zip(baseline,b)) if x!=y and i not in (3,5,7,11,14,17)]==[], 'Unexpected V5.22 script change'
              elif os.environ.get('GITHUB_HEAD_REF')=='lerika-v521-calculations':
                  assert [i for i,(x,y) in enumerate(zip(a,b)) if x!=y and i not in (3,5,7,12,17)]==[], 'Unexpected V5.21 script change'
              elif os.environ.get('GITHUB_HEAD_REF')=='lerika-v523-interface':
                  assert [i for i,(x,y) in enumerate(zip(a,b)) if x!=y and i not in (6,8,13,14,16,17)]==[], 'Unexpected V5.23 script change'
              else:
                  assert all(a[i]==b[i] for i in [2,3,4,8,9,12,13,16] if i<len(a)), 'Shared engine changed'
              if a[10]!=b[10]:
                  restored=b[10].replace('handle:item.handle||"brass",config:item.config','handle:"brass"').replace(',textureRotation:item.rot','')
                  assert restored==a[10], 'Unexpected room model change'
          assert 'id="lab-ai-generate"' not in new
          with tempfile.TemporaryDirectory() as td:
              for i,js in enumerate(b):
                  if not js.strip():continue
                  p=pathlib.Path(td)/f'{i}.js';p.write_text(js)
                  subprocess.run(['node','--check',str(p)],check=True)
          print('Furniture and engineering engines protected; room adapter changes checked; JS syntax OK')
          PY
      - name: Room planner core tests
        if: ${{ hashFiles('tests/room-planner.cjs') != '' }}
        run: node tests/room-planner.cjs
      - name: Room planner mobile browser tests
        if: ${{ hashFiles('tests/room-planner-browser.cjs') != '' }}
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node tests/room-planner-browser.cjs
      - name: Engineering geometry tests
        if: ${{ hashFiles('tests/engineering.cjs') != '' }}
        run: node tests/engineering.cjs
      - name: Independent CAD parser interoperability
        if: ${{ hashFiles('tests/dxf-interop.py') != '' }}
        run: |
          pip install ezdxf==1.4.3
          python tests/dxf-interop.py
      - name: Independent 3D depth and ownership regression
        if: ${{ hashFiles('tests/depth-browser.cjs') != '' }}
        run: node tests/depth-browser.cjs
      - name: Engineering mobile browser tests
        if: ${{ hashFiles('tests/engineering-browser.cjs') != '' }}
        run: node tests/engineering-browser.cjs

      - name: Responsive layout regression
        if: ${{ hashFiles('tests/mobile-layout.cjs') != '' }}
        run: node tests/mobile-layout.cjs

      - name: Drawing zoom browser regression
        if: ${{ hashFiles('tests/zoom-viewer.cjs') != '' }}
        run: node tests/zoom-viewer.cjs

      - name: Unified project and estimate browser regression
        run: node tests/unified-project-browser.cjs
  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lerika_qa
          POSTGRES_PASSWORD: lerika_qa
          POSTGRES_DB: lerika_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lerika_qa -d lerika_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cabinet/requirements.txt
      - name: Security regressions on disposable PostgreSQL 17
        run: python -m unittest -v test_design_studio
        working-directory: cabinet
        env:
          LERIKA_QA_POSTGRES: '1'

  image-source-review:
    if: github.head_ref == 'lerika-v523-interface'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Review only existing public portfolio images
        run: |
          python - <<'PY'
          from PIL import Image,ImageOps
          import base64,io
          for i,name in enumerate(['Screenshot_20261127_020103_VK.jpg','Screenshot_20261127_030255_Telegram.jpg','Screenshot_20261127_080304_ChatGPT.jpg']):
              im=ImageOps.exif_transpose(Image.open(name)).convert('RGB')
              print('SOURCE',i,im.size)
              im.thumbnail((400,650)); buf=io.BytesIO(); im.save(buf,'JPEG',quality=78)
              s=base64.b64encode(buf.getvalue()).decode()
              for start in range(0,len(s),3000): print('THUMB',i,start,s[start:start+3000])
          PY
