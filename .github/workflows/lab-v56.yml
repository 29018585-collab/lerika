name: Lab V5.6 isolated regression
on:
  pull_request:
    branches: [lerika-cabinet-v1]
    paths: ['index.html', 'cabinet/**', '.github/workflows/lab-v56.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cabinet/requirements.txt
      - run: python -m unittest -v test_design_studio
        working-directory: cabinet
      - name: Validate scripts and preserve the furniture engine
        run: |
          python - <<'PY'
          import re, subprocess, pathlib, tempfile
          new=pathlib.Path('index.html').read_text()
          old=subprocess.check_output(['git','show','origin/lerika-cabinet-v1:index.html'],text=True)
          def scripts(s):return re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',s,re.I)
          a,b=scripts(old),scripts(new)
          assert len(a)==len(b)
          assert sum(x!=y for x,y in zip(a,b))<=1, 'Unrelated scripts changed'
          assert 'id="lab-ai-generate"' not in new
          with tempfile.TemporaryDirectory() as td:
              for i,js in enumerate(b):
                  if not js.strip():continue
                  p=pathlib.Path(td)/f'{i}.js';p.write_text(js)
                  subprocess.run(['node','--check',str(p)],check=True)
          print('Furniture engine and other non-studio scripts unchanged; JS syntax OK')
          PY
