name: LERIKA production read-only smoke
on:
  push:
    branches: [lerika-v520-ingress-qa]
    paths: ['.github/workflows/lerika-production-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages and unauthenticated access
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://lerika-cabinet.onrender.com
          check() {
            local path="$1" expected="$2" code
            code=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' "$BASE$path")
            printf '%s: %s (expected %s)\n' "$path" "$code" "$expected"
            test "$code" = "$expected"
          }
          check / 302
          check /showroom/ 200
          # Confirm deployed showroom serves the V5.21 calculation/export implementation.
          curl -fsS --max-time 60 "$BASE/showroom/" -o /tmp/lerika-showroom.html
          grep -Fq 'Корпус (в расчёте)' /tmp/lerika-showroom.html
          grep -Fq 'function panelProjection' /tmp/lerika-showroom.html
          grep -Fq 'new Float64Array(W*H)' /tmp/lerika-showroom.html
          grep -Fq 'function flushSave()' /tmp/lerika-showroom.html
          grep -Fq 'ЛЕРИКА · V5.23' /tmp/lerika-showroom.html
          grep -Fq 'name="lerika-portfolio-api" content="/"' /tmp/lerika-showroom.html
          test "$(wc -c </tmp/lerika-showroom.html)" -lt 500000
          echo "PASS: V5.21–V5.23 markers and reduced HTML: $(wc -c </tmp/lerika-showroom.html) bytes"
          check /showroom/public-kitchen-82efc7056beb5d38.webp 200
          check /showroom/public-stairs-29648d9037e33a71.webp 200
          check /showroom/scene-lit-3027a1761979dacd.webp 200
          curl -fsS --max-time 60 -D /tmp/lerika-headers -o /dev/null "$BASE/showroom/public-kitchen-82efc7056beb5d38.webp"
          grep -Eiq '^cache-control:.*public.*max-age=31536000.*immutable' /tmp/lerika-headers
          curl -fsS --max-time 60 -D /tmp/lerika-api-headers -o /dev/null "$BASE/public/prices"
          grep -Eiq '^cache-control:.*no-store' /tmp/lerika-api-headers
          echo 'PASS: public immutable assets and no-store API'
          check /cabinet/ 200
          check /public/prices 200
          check /public/portfolio 200
          check /api/projects 401
          check /api/client/session 401
          echo 'PASS: post-V5.23 live deployment read-only smoke; no customer submissions or authenticated writes'
