name: LERIKA cabinet privacy tests
on:
  push:
    branches: [lerika-cabinet-v1]
    paths: ['cabinet/**', '.github/workflows/cabinet-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cabinet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_privacy
      - run: node --check static/admin.js
